name: cawil
description: A new Flutter project.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=2.18.4 <3.0.0'

dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  swipeable_button_view: ^0.0.1
  page_transition: ^2.0.9
  dotted_line: ^3.1.0
  flutter_custom_clippers: ^2.1.0
  firebase_core: ^2.6.1
  firebase_auth: ^4.2.8
  cloud_firestore: ^4.4.2
  firebase_storage: ^11.0.13
  image_picker: ^0.8.6+2
  responsive_framework: ^0.2.0
  provider: ^6.0.5
  flutter_svg: ^1.1.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_native_splash: ^2.2.17
flutter_native_splash:
  color: '#EDE7F6'
  image: assets/caleb3.png
  web: false


  flutter_launcher_icons: ^0.11.0
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21


  flutter_lints: ^2.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/

